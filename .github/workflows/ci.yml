name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Check release scripts
        run: |
          bash -n script/release.sh
          node --check script/publish-sdk.mjs
          node --check script/publish-plugins.mjs
          node --check script/mirror-catalog.mjs

      - name: Build and package catalog
        run: pnpm run catalog --base-url=https://example.invalid/

      - name: Check creator CLI
        run: node packages/create-plugin-sdk/index.js --help

      - name: Check npm packages
        run: |
          pnpm --dir packages/plugin-sdk --config.ignore-scripts=true pack --dry-run
          pnpm --dir packages/create-plugin-sdk --config.ignore-scripts=true pack --dry-run
