name: Publish plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-plugins
  queue: max

jobs:
  plugins:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Publish plugins and catalog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/check-versions.mjs plugins

      - name: Install dependencies
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm run lint

      - name: Check formatting
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm run format:check

      - name: Configure Pages
        if: ${{ steps.versions.outputs.publish == 'true' }}
        uses: actions/configure-pages@v5

      - name: Publish plugins and generate catalog
        if: ${{ steps.versions.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ steps.versions.outputs.packages }}
        run: node script/publish-plugins.mjs

      - name: Upload catalog
        if: ${{ steps.versions.outputs.publish == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

      - name: Deploy catalog
        if: ${{ steps.versions.outputs.publish == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prepare EdgeOne deployment
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: node script/mirror-catalog.mjs dist/pages/catalog.json https://kite-plugins.zzde.me/

      - name: Deploy to EdgeOne Makers
        if: ${{ steps.versions.outputs.publish == 'true' }}
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          : "${EDGEONE_API_TOKEN:?Set the EDGEONE_API_TOKEN repository secret}"
          pnpm dlx edgeone@1.6.37 makers deploy ./dist/edgeone \
            --name kite-plugins \
            --token "$EDGEONE_API_TOKEN" \
            --env production \
            --area overseas
