name: Publish plugin

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing plugin tag, for example cert-manager-v0.1.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-plugin-catalog
  queue: max

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PLUGIN_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out plugin release
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PLUGIN_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish plugin and merge catalog
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_URL: ${{ steps.pages.outputs.base_url }}/catalog.json
        run: node scripts/publish-plugin.mjs "$PLUGIN_TAG" "$CATALOG_URL"

      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4
