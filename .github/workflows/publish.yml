name: Publish SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sdk
  queue: max

jobs:
  sdk:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Publish SDK and creator
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Check versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node script/check-versions.mjs sdk

      - name: Install dependencies
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm run lint

      - name: Check formatting
        if: ${{ steps.versions.outputs.publish == 'true' }}
        run: pnpm run format:check

      - name: Build, package, and publish SDK and creator
        if: ${{ steps.versions.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ steps.versions.outputs.packages }}
        run: node script/publish-sdk.mjs
