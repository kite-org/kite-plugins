name: Publish

on:
  push:
    tags: ['*-v*']

permissions:
  contents: read

jobs:
  plugin:
    if: ${{ !github.event.deleted && !startsWith(github.ref_name, 'plugin-sdk-v') }}
    concurrency:
      group: publish-plugin-catalog
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out plugin release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish plugin and merge catalog
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_URL: ${{ steps.pages.outputs.base_url }}/catalog.json
        run: node script/publish-plugin.mjs "$GITHUB_REF_NAME" "$CATALOG_URL"

      - name: Upload catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prepare EdgeOne deployment
        run: node script/mirror-catalog.mjs dist/pages/catalog.json https://kite-plugins.zzde.me/

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          : "${EDGEONE_API_TOKEN:?Set the EDGEONE_API_TOKEN repository secret}"
          pnpm dlx edgeone@1.6.37 makers deploy ./dist/edgeone \
            --name kite-plugins \
            --token "$EDGEONE_API_TOKEN" \
            --env production \
            --area overseas

  sdk:
    if: ${{ !github.event.deleted && startsWith(github.ref_name, 'plugin-sdk-v') }}
    concurrency:
      group: publish-sdk
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out SDK release
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint SDK and creator
        run: pnpm exec eslint packages/plugin-sdk packages/create-plugin-sdk

      - name: Check formatting
        run: pnpm exec prettier --check packages/plugin-sdk packages/create-plugin-sdk

      - name: Build, package, and publish SDK and creator
        run: node script/publish-sdk.mjs "$GITHUB_REF_NAME"
